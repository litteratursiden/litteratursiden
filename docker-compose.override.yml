services:
  es:
    image: elasticsearch:9.5.5
    networks:
      - app
      - frontend
    deploy:
      resources:
        limits:
          memory: 4096M
        reservations:
          memory: 4096M
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false

  phpfpm:
    depends_on:
      - es
